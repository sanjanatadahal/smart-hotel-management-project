<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Riverside Treat</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useState } = React;

    function App() {
      const [currentSlide, setCurrentSlide] = useState(0);
      const [booking, setBooking] = useState({
        checkIn: "",
        checkOut: "",
        adults: 2,
        rooms: 1,
        kids: 0
      });

      const slides = [
        {
          image: "./img 2.jpg",
          alt: "Hotel View",
          content: (
            <div className="welcome-text">
              <p>Welcome to the Hotel</p>
              <h1>The Riverside Treat</h1>
              <p>A stay that will stay with you</p>
            </div>
          )
        },
        {
          image: "./lobby.jpg",
          alt: "Hotel Lobby",
          content: <div className="slide-quote lobby-quote">Wait or Relax here</div>
        },
        {
          image: "./swimming pool.jpg",
          alt: "Swimming Pool",
          content: <div className="slide-quote pool-quote">Dive into Relaxation</div>
        },
        {
          image: "./room img 1.webp",
          alt: "Hotel Room",
          content: <div className="slide-quote room-quote">Enjoy the River Side View</div>
        }
      ];

      useEffect(() => {
        const sliderTimer = setInterval(() => {
          setCurrentSlide((previous) => (previous + 1) % slides.length);
        }, 4000);

        return () => clearInterval(sliderTimer);
      }, []);

      function updateBooking(event) {
        setBooking({
          ...booking,
          [event.target.name]: event.target.value
        });
      }
      function changeCount(field, change, minimum) {
        setBooking((previous) => ({
        ...previous,
        [field]: Math.max(minimum, Number(previous[field]) + change)
        }));
      }
      function checkAvailability(event) {
        event.preventDefault();

        if (!booking.checkIn || !booking.checkOut) {
          alert("Please select check-in and check-out dates.");
          return;
        }

        alert(
          `Checking availability for ${booking.adults} adults, ${booking.kids} kids and ${booking.rooms} room(s).`
        );
      }

      return (
        <>
          <nav>
            <div className="nav-links">
              <a href="#">Home</a>
              <a href="./rooms.html">Rooms</a>
              <a href="#">Services</a>
              <a href="#">About</a>
              <a href="#">Contact</a>
            </div>
          </nav>

          <section className="slider">
            <div
              className="slides"
              style={{ transform: `translateX(-${currentSlide * 100}%)` }}
            >
              {slides.map((slide, index) => (
                <div className="slide" key={index}>
                  <img src={slide.image} alt={slide.alt} />
                  {slide.content}
                </div>
              ))}
            </div>
          </section>

          <section className="booking-section">
            <form className="booking-bar" onSubmit={checkAvailability}>
              <div className="field">
                <label>📅 CHECK-IN DATE</label>
                <input
                  type="date"
                  name="checkIn"
                  value={booking.checkIn}
                  onChange={updateBooking}
                  required
                />
              </div>

              <div className="field">
                <label>🗓️ CHECK-OUT DATE</label>
                <input
                  type="date"
                  name="checkOut"
                  value={booking.checkOut}
                  onChange={updateBooking}
                  required
                />
              </div>

              <div className="field small-field">
                <label>👤 ADULTS</label>
                <input
                  type="number"
                  name="adults"
                  min="1"
                  value={booking.adults}
                  onChange={updateBooking}
                />
              </div>

              <div className="field small-field">
                <label>🛏️ ROOMS</label>
                <input
                  type="number"
                  name="rooms"
                  min="1"
                  value={booking.rooms}
                  onChange={updateBooking}
                />
              </div>

              <div className="field small-field">
                <label>👶 KIDS</label>
                <input
                  type="number"
                  name="kids"
                  min="0"
                  value={booking.kids}
                  onChange={updateBooking}
                />
              </div>

              <button className="search-btn" type="submit">
                Check Availability
              </button>
            </form>
          </section>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
